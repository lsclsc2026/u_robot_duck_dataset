schema_version: 1

camera:
  topic: /camera/front/image/compressed
  message_type: sensor_msgs/msg/CompressedImage
  expected_format: jpeg
  expected_width: 960
  expected_height: 540
  nominal_fps: 15.0

storage:
  # Reference only: CLI does not load this YAML. Set --root or U_ROBOT_DUCK_DATA_ROOT.
  data_root: ~/data/duck_dataset
  sessions_subdir: sessions

extraction:
  preserve_compressed_payload: true
  sample_fps: 0.0  # 0 keeps every frame for future SAM 2 tracking.

visualization:
  contact_sheet_samples: 24
  contact_sheet_columns: 4
  thumbnail_width: 320
  thumbnail_height: 180
  preview_fps: 0.0  # 0 estimates the rate from timestamps.

dataset:
  class_names:
    - duck
  split_unit: session
  export_fps_min: 2.0
  export_fps_max: 5.0

# Reserved for the GPU stage. These values are documentation only for now.
future_inference:
  enabled: false
  detector: groundingdino_swint_ogc.pth
  detector_prompts:
    - yellow rubber duck .
    - rubber duck .
    - yellow duck toy .
    - toy duck .
  segmenter: sam2.1_hiera_base_plus.pt

